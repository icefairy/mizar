<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开阳 Mizar</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<!-- 登录页 -->
<div id="login" class="login-wrap">
  <form id="loginForm" class="login-card" autocomplete="off">
    <h1>开阳 · Mizar</h1>
    <p class="sub">Agent Web UI</p>
    <label>用户名<input id="username" type="text" placeholder="admin" autocomplete="username"></label>
    <label>密码<input id="password" type="password" placeholder="密码" autocomplete="current-password"></label>
    <button type="submit" id="loginBtn">登录</button>
    <div id="loginErr" class="err"></div>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="app hidden">
  <!-- 左侧会话栏 -->
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <button id="newConvBtn" class="new-conv" type="button">+ 新建会话</button>
      <button id="pinBtn" class="pin-btn" type="button" title="锁定侧栏常驻（PC 端）">📌</button>
    </div>
    <div id="convList" class="conv-list"></div>
    <div class="side-foot">
      <button id="settingsBtn" class="ghost wide" type="button">⚙ 设置</button>
      <button id="logoutBtn" class="ghost wide" type="button">退出</button>
    </div>
  </aside>

  <!-- 右侧主区 -->
  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="ghost only-mobile" type="button">☰</button>
      <div class="brand">开阳 · Mizar</div>
      <div class="modes">
        <button id="modeChat" class="mode active" type="button">普通对话</button>
        <button id="modeAgent" class="mode" type="button">Agent 模式</button>
      </div>
      <div class="right">
        <span id="modelTag" class="model-tag"></span>
        <button id="themeBtn" class="ghost" type="button" title="切换主题">🌙</button>
        <button id="abortBtn" class="ghost hidden" type="button">中止</button>
      </div>
    </header>

    <main id="log" class="log"></main>

    <footer class="composer">
      <div id="steerRow" class="steer-row hidden">
        <div class="steer-label">⚡ 纠偏中...</div>
        <textarea id="steerInput" rows="2" placeholder="输入纠正消息（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="steerSend" type="button">纠正</button>
        <button id="steerDone" type="button" class="ghost">完成纠偏</button>
      </div>
      <!-- 快捷参数行：模型 + 思考等级 -->
      <div class="quickbar">
        <label class="qk">
          <span>模型</span>
          <input id="qkModel" type="text" placeholder="deepseek-v4-flash" list="modelList" spellcheck="false">
        </label>
        <label class="qk">
          <span>思考</span>
          <select id="qkThinking">
            <option value="auto">自动</option>
            <option value="off">关闭</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
          </select>
        </label>
        <span id="quickMsg" class="quick-msg"></span>
      </div>
      <div class="input-row">
        <textarea id="input" rows="5" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
        <button id="sendBtn" type="button">发送</button>
      </div>
    </footer>
  </div>
</div>

<!-- 设置面板 -->
<div id="settings" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <h2>设置</h2>
      <button id="settingsClose" class="ghost" type="button">✕</button>
    </div>
    <div class="modal-body">
      <label class="field">
        <span>模型</span>
        <div class="row">
          <input id="setModel" type="text" placeholder="deepseek-v4-flash" list="modelList">
          <button id="refreshModels" class="ghost" type="button">拉取</button>
        </div>
        <datalist id="modelList"></datalist>
        <small id="modelHint" class="hint"></small>
      </label>

      <label class="field">
        <span>思考等级</span>
        <select id="setThinking">
          <option value="auto">自动 (auto)</option>
          <option value="off">关闭 (off)</option>
          <option value="low">低 (low)</option>
          <option value="medium">中 (medium)</option>
          <option value="high">高 (high)</option>
        </select>
      </label>

      <label class="field">
        <span>最大历史条数（普通对话）</span>
        <input id="setMaxHistory" type="number" min="1" step="1" placeholder="50">
        <small class="hint">普通对话模式最多发送的历史消息条数，默认 50；Agent 模式不受此限制。</small>
      </label>

      <label class="field">
        <span>温度 temperature <em id="tempVal">—</em></span>
        <input id="setTemp" type="range" min="0" max="2" step="0.1">
        <button id="tempClear" class="link" type="button">用默认值</button>
      </label>

      <label class="field">
        <span>核采样 top_p <em id="toppVal">—</em></span>
        <input id="setTopp" type="range" min="0" max="1" step="0.05">
        <button id="toppClear" class="link" type="button">用默认值</button>
      </label>

      <label class="field">
        <span>最大输出 token</span>
        <input id="setMaxTokens" type="number" min="0" step="256" placeholder="0 = 不限制">
      </label>

      <label class="field">
        <span>系统提示词</span>
        <textarea id="setSystem" rows="3" placeholder="留空使用默认"></textarea>
      </label>
    </div>
    <div class="modal-foot">
      <span id="settingsMsg" class="hint"></span>
      <button id="settingsSave" class="primary" type="button">保存并应用</button>
    </div>
  </div>
</div>

<script src="/web/app.js"></script>
</body>
</html>
